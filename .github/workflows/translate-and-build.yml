name: Sync translations and build English site

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'index.html'
      - 'pages/**/*.html'
      - 'data/ar.json'
      - 'data/en.json'
      - 'tools/**'
      - '.github/workflows/translate-and-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install HTML parser
        run: python -m pip install beautifulsoup4

      - name: Sync translations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python tools/sync_translations.py

      - name: Build English mirror
        run: python tools/build_english.py

      - name: Commit generated translations and English pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ar.json data/en.json en/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Auto-sync English translation"
            git push
          fi
